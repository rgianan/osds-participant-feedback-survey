[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers are NOT declared here. They live in config/_headers and are
# copied to dist/_headers by `npm run build` (scripts/headers.mjs).
#
# `netlify dev` applies headers from a [[headers]] block here, from public/,
# AND from dist/ — so none of those can separate dev from production. The CSP's
# script-src blocks Vite's inline React Refresh preamble, which makes every
# React module throw "can't detect preamble" and renders a blank page with no
# console error. Start local work with `npm run dev:netlify`, which clears
# dist/_headers first.
